<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1680" viewBox="0 0 1400 1680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1400" height="1680" fill="#f8fafc"/>

  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0f172a">Stage 2 — Transcribe</text>
  <text x="40" y="74" font-size="15" fill="#475569">cli/transcribe.py · transcribe() · internal steps 1/6 … 6/6</text>
  <text x="40" y="96" font-size="13" font-style="italic" fill="#64748b">MP3 → vocal/accompaniment stems + timestamped words + CREPE pitch timeline + pauses + BPM → TranscribeResult</text>

  <!-- Step 1 -->
  <rect x="60" y="118" width="1280" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="76" y="134" width="96" height="26" rx="13" fill="#0f172a"/>
  <text x="124" y="152" font-size="13" fill="#fff" text-anchor="middle">STEP 1/6</text>
  <text x="190" y="152" font-size="15" font-weight="bold" fill="#0f172a">Load audio — soundfile.sf.read(mp3)  →  float32 samples @ sr · channel layout kept</text>
  <text x="190" y="178" font-size="12.5" fill="#475569">no downmix here: stereo goes straight into Demucs (after separation)  ·  device: config.device (auto → cuda if available, else cpu)</text>

  <line x1="700" y1="196" x2="700" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Loop container -->
  <rect x="60" y="222" width="1280" height="430" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="80" y="208" width="480" height="28" rx="14" fill="#334155"/>
  <text x="320" y="227" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold">STEP 2/6 · for run = 1 … transcribe_runs (config, default 3):</text>

  <!-- Demucs box -->
  <rect x="90" y="262" width="580" height="372" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="110" y="290" font-size="15" font-weight="bold" fill="#6d28d9">Demucs — htdemucs, 44100 Hz (loaded once, reused per pass)</text>
  <text x="110" y="314" font-size="12.5" fill="#475569">stereo → passed as-is (stereo htdemucs) · mono → duplicated · resample 44.1 kHz → apply_model</text>

  <rect x="110" y="330" width="125" height="40" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="172" y="355" font-size="13" fill="#4c1d95" text-anchor="middle">drums</text>
  <rect x="247" y="330" width="125" height="40" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="309" y="355" font-size="13" fill="#4c1d95" text-anchor="middle">bass</text>
  <rect x="384" y="330" width="125" height="40" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="446" y="355" font-size="13" fill="#4c1d95" text-anchor="middle">other</text>
  <rect x="521" y="330" width="125" height="40" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
  <text x="583" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">vocals</text>

  <line x1="583" y1="370" x2="583" y2="402" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="172" y1="370" x2="172" y2="388" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="309" y1="370" x2="309" y2="388" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="446" y1="370" x2="446" y2="388" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="172" y1="388" x2="520" y2="388" stroke="#a78bfa" stroke-width="1.5"/>

  <text x="110" y="426" font-size="13" fill="#0f172a">vocals = stem 3 → mono</text>
  <text x="110" y="450" font-size="13" fill="#0f172a">accompaniment = drums + bass + other (summed) → mono</text>

  <rect x="110" y="468" width="540" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="124" y="492" font-size="12" fill="#6d28d9">Demucs is not fully deterministic, so each pass yields a slightly</text>
  <text x="124" y="510" font-size="12" fill="#6d28d9">different split → repeated passes enable voting (below).</text>

  <text x="110" y="564" font-size="12.5" fill="#475569" font-family="Consolas, monospace">sf.write(tmp/song_vocals.wav)</text>
  <text x="110" y="586" font-size="12.5" fill="#64748b">only pass 1 stems are kept; later passes freed (gc + cuda empty_cache)</text>

  <!-- WhisperX box -->
  <rect x="710" y="262" width="640" height="372" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="730" y="290" font-size="15" font-weight="bold" fill="#1d4ed8">WhisperX — load_model(config.whisperx_model, default "medium")</text>
  <text x="730" y="314" font-size="12.5" fill="#475569">input: tmp/song_vocals.wav (vocals only, so recognition ignores instruments)</text>
  <text x="730" y="342" font-size="12.5" fill="#0f172a" font-family="Consolas, monospace">result = model.transcribe(audio, batch_size=config.whisperx_batch_size)</text>
  <text x="730" y="362" font-size="12.5" fill="#0f172a" font-family="Consolas, monospace">aligned = whisperx.align(result["segments"], model_a, metadata, audio,</text>
  <text x="730" y="382" font-size="12.5" fill="#0f172a" font-family="Consolas, monospace">    device, return_char_alignments=True)</text>

  <rect x="730" y="400" width="120" height="44" rx="8" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="790" y="420" font-size="13" fill="#1e3a8a" text-anchor="middle">hello</text>
  <text x="790" y="437" font-size="10.5" fill="#1e3a8a" text-anchor="middle">0.42 – 0.70 s</text>
  <rect x="862" y="400" width="120" height="44" rx="8" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="922" y="420" font-size="13" fill="#1e3a8a" text-anchor="middle">world</text>
  <text x="922" y="437" font-size="10.5" fill="#1e3a8a" text-anchor="middle">0.71 – 1.02 s</text>
  <rect x="994" y="400" width="120" height="44" rx="8" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="1054" y="420" font-size="13" fill="#1e3a8a" text-anchor="middle">this</text>
  <text x="1054" y="437" font-size="10.5" fill="#1e3a8a" text-anchor="middle">1.88 – 2.05 s</text>
  <text x="1150" y="428" font-size="16" fill="#64748b">…</text>

  <text x="730" y="486" font-size="12.5" fill="#475569">aligned words per pass: [{word, start, end, score, characters}]</text>
  <text x="730" y="510" font-size="12.5" fill="#475569">language hint: config.whisperx_language; aligner chosen per language</text>
  <rect x="730" y="528" width="600" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="744" y="552" font-size="12" fill="#1d4ed8">Debug dump: tmp/song_whisperx_passes.json (words + character alignments).</text>
  <text x="744" y="570" font-size="12" fill="#1d4ed8">Empty runs skipped; all runs empty → RuntimeError.</text>

  <line x1="670" y1="446" x2="708" y2="446" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="689" y="434" font-size="11" fill="#475569" text-anchor="middle">wav</text>

  <!-- Consolidation -->
  <line x1="700" y1="652" x2="700" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="678" width="1280" height="212" rx="10" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <rect x="76" y="664" width="460" height="28" rx="14" fill="#b91c1c"/>
  <text x="306" y="683" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold">Consensus — cli/consensus.py (only when runs &gt; 1)</text>
  <text x="90" y="716" font-size="13" fill="#0f172a">1. Longest run = structural reference (its word boundaries define the consensus).</text>
  <text x="90" y="740" font-size="13" fill="#0f172a">2. Every other run aligned to the reference with Smith–Waterman on whole words (score = word_similarity:</text>
  <text x="110" y="760" font-size="13" fill="#0f172a">symmetric average of best phonetic char matches — near-homophones align, unrelated words don't).</text>
  <text x="90" y="786" font-size="13" fill="#0f172a">3. Majority vote picks the word; timing + characters come from the highest-quality matching candidate.</text>
  <text x="90" y="838" font-size="12.5" fill="#7f1d1d" font-family="Consolas, monospace">run 1:    hello   world   this   is   a   test</text>
  <text x="90" y="858" font-size="12.5" fill="#7f1d1d" font-family="Consolas, monospace">run 2:    hallo   wordl   this   is   a   test   →   consensus:  hello  world  this  is  a  test</text>

  <!-- Step 3 & 4 -->
  <line x1="360" y1="890" x2="360" y2="928" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1010" y1="890" x2="1010" y2="928" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="910" width="640" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="76" y="926" width="96" height="26" rx="13" fill="#0f172a"/>
  <text x="124" y="944" font-size="13" fill="#fff" text-anchor="middle">STEP 3/6</text>
  <text x="190" y="944" font-size="15" font-weight="bold" fill="#0f172a">Save stems from pass 1 (lameenc, mono, 128 kbps)</text>
  <text x="190" y="970" font-size="12.5" fill="#475569" font-family="Consolas, monospace">tmp/song_vocals.mp3   ·   tmp/song_accompaniment.mp3</text>
  <text x="190" y="992" font-size="12" fill="#64748b">encoded from float32 via int16 → lameenc (no temp WAV files)</text>

  <rect x="720" y="910" width="620" height="100" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <rect x="736" y="926" width="96" height="26" rx="13" fill="#0e7490"/>
  <text x="784" y="944" font-size="13" fill="#fff" text-anchor="middle">STEP 4/6</text>
  <text x="850" y="944" font-size="15" font-weight="bold" fill="#155e75">BPM + grid phase — detect_bpm() (librosa, diagram 3)</text>
  <text x="850" y="970" font-size="12.5" fill="#155e75">input: accompaniment.mp3 if bpm_use_accompaniment (default) else song.mp3</text>
  <text x="850" y="992" font-size="12.5" fill="#155e75">→ BpmResult {bpm, first_beat_ms, stable, chunk_bpms}</text>

  <!-- Step 5 & 6 -->
  <line x1="360" y1="1010" x2="360" y2="1038" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1010" y1="1010" x2="1010" y2="1038" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="1036" width="640" height="240" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="76" y="1052" width="96" height="26" rx="13" fill="#047857"/>
  <text x="124" y="1070" font-size="13" fill="#fff" text-anchor="middle">STEP 5/6</text>
  <text x="190" y="1070" font-size="15" font-weight="bold" fill="#065f46">Pitch — torchcrepe on pass-1 vocals (model "full", Viterbi decode)</text>
  <text x="90" y="1100" font-size="12.5" fill="#065f46">resampled to 16000 Hz · hop = crepe_hop_ms (10 ms) · fmin 65.41 Hz (C2) – fmax 1046.5 Hz (C6)</text>
  <text x="90" y="1124" font-size="12.5" fill="#065f46">per frame: frequency + periodicity (confidence 0..1)</text>
  <text x="90" y="1148" font-size="12.5" fill="#065f46">amplitude proxy: band energy 60–1000 Hz (Hann window, FFT 1024 samples frame),</text>
  <text x="110" y="1166" font-size="12.5" fill="#065f46">normalized to 0..1 (max = 1), zero-padded/truncated to CREPE frame count</text>
  <rect x="90" y="1184" width="580" height="72" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="104" y="1208" font-size="12.5" fill="#065f46">→ PitchFrame(time, midi, confidence, amplitude) — FULL timeline,</text>
  <text x="104" y="1228" font-size="12.5" fill="#065f46">quiet frames included (needed for activity thresholds and preview overlay).</text>
  <text x="104" y="1250" font-size="11.5" fill="#64748b">midi = round(12·log2(hz/440) + 69), hz ≤ 0 → 0</text>

  <rect x="720" y="1036" width="620" height="240" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="736" y="1052" width="96" height="26" rx="13" fill="#0f172a"/>
  <text x="784" y="1070" font-size="13" fill="#fff" text-anchor="middle">STEP 6/6</text>
  <text x="850" y="1070" font-size="15" font-weight="bold" fill="#0f172a">Pauses — RMS energy on pass-1 vocals</text>
  <text x="750" y="1100" font-size="12.5" fill="#334155">frame 25 ms, hop 10 ms → per-frame RMS</text>
  <text x="750" y="1124" font-size="12.5" fill="#334155">silent when RMS &lt; 5% of the 95th percentile (pause_threshold_pct / 100)</text>
  <text x="750" y="1148" font-size="12.5" fill="#334155">keep silences of ≥ 400 ms (pause_min_silence_ms) → Pause(start, end)</text>
  <!-- mini rms bars -->
  <g>
    <rect x="750" y="1180" width="14" height="20" fill="#94a3b8"/>
    <rect x="768" y="1168" width="14" height="32" fill="#475569"/>
    <rect x="786" y="1174" width="14" height="26" fill="#64748b"/>
    <rect x="804" y="1184" width="14" height="16" fill="#cbd5e1"/>
    <rect x="822" y="1186" width="14" height="14" fill="#e2e8f0"/>
    <rect x="840" y="1186" width="14" height="14" fill="#e2e8f0"/>
    <rect x="858" y="1185" width="14" height="15" fill="#e2e8f0"/>
    <rect x="876" y="1170" width="14" height="30" fill="#475569"/>
    <rect x="894" y="1164" width="14" height="36" fill="#334155"/>
    <rect x="912" y="1178" width="14" height="22" fill="#64748b"/>
    <rect x="930" y="1184" width="14" height="16" fill="#cbd5e1"/>
    <rect x="948" y="1186" width="14" height="14" fill="#e2e8f0"/>
    <rect x="966" y="1168" width="14" height="32" fill="#475569"/>
    <rect x="984" y="1172" width="14" height="28" fill="#64748b"/>
    <rect x="1002" y="1180" width="14" height="20" fill="#94a3b8"/>
    <rect x="822" y="1178" width="50" height="34" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="930" y="1178" width="32" height="34" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="1050" y="1198" font-size="11.5" fill="#b91c1c">RMS bars:</text>
  <text x="1050" y="1214" font-size="11.5" fill="#b91c1c">dashed = pause kept</text>
  <text x="750" y="1252" font-size="11.5" fill="#64748b">→ hard timing boundaries for alignment (silence is never sung across)</text>

  <!-- Attach pitch -->
  <line x1="380" y1="1276" x2="600" y2="1334" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1000" y1="1276" x2="800" y2="1334" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="1306" width="1280" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="1336" font-size="15" font-weight="bold" fill="#0f172a">Attach pitch to words — add_pitch_to_words()</text>
  <text x="90" y="1362" font-size="12.5" fill="#334155">per word: median Hz→MIDI inside [start, end] using first confidence threshold with data (0.5 → 0.3 → 0.1, else 60), fallback word.midi</text>
  <text x="90" y="1386" font-size="12.5" fill="#334155">word's pitch frames kept (confidence &gt; 0.1) → WordTimestamp(word, start, end, midi, pitch_frames)</text>
  <text x="90" y="1410" font-size="12" fill="#64748b">consensus words + pitch + pauses + stems + BpmResult are all combined here</text>

  <!-- Output -->
  <line x1="700" y1="1426" x2="700" y2="1462" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="1456" width="1280" height="170" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="90" y="1488" font-size="15" font-weight="bold" fill="#166534">TranscribeResult (cli/pipeline_types.py)</text>
  <g font-size="12" fill="#14532d">
    <rect x="90" y="1504" width="190" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/><text x="185" y="1524" text-anchor="middle">words: [WordTimestamp]</text>
    <rect x="292" y="1504" width="120" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/><text x="352" y="1524" text-anchor="middle">language</text>
    <rect x="424" y="1504" width="120" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/><text x="484" y="1524" text-anchor="middle">vocals_path</text>
    <rect x="556" y="1504" width="180" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/><text x="646" y="1524" text-anchor="middle">accompaniment_path</text>
    <rect x="748" y="1504" width="110" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/><text x="803" y="1524" text-anchor="middle">pauses: [Pause]</text>
    <rect x="870" y="1504" width="150" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/><text x="945" y="1524" text-anchor="middle">pitch_frames: [PitchFrame]</text>
    <rect x="1032" y="1504" width="150" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/><text x="1107" y="1524" text-anchor="middle">bpm / bpm_result</text>
  </g>
  <text x="90" y="1566" font-size="12.5" fill="#166534">Saved to tmp/song_transcribe.json → resume point: "ultrasongs process … --resume" or "--stage align"</text>
  <text x="90" y="1590" font-size="12.5" fill="#166534">Feeds Stage 3/4/5: pitch frames + pauses → align · bpm_result + stems → generate + package</text>
</svg>
